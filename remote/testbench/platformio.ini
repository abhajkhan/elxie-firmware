; Elxie REMOTE testbench (ESP8266 / LOLIN D1 Mini).
; Built and flashed by REMOTE_TESTBENCH.bat. Afterwards FLASH_REMOTE_FIRMWARE.bat
; puts the normal remote firmware back.

[env:d1_mini]
; espressif8266 4.2.1 = Arduino ESP8266 core 3.1.2
platform = espressif8266 @ 4.2.1
framework = arduino
board = d1_mini
upload_speed = 921600
monitor_speed = 115200
; Pairing code shared with the real remote firmware
build_flags = -I ../firmware/src
