; Elxie hand remote: the normal firmware (REMOTE_espnow.ino from the team's
; elxie-firmware repo root, now with pairing). Flashed by FLASH_REMOTE_FIRMWARE.bat.

[env:d1_mini]
; espressif8266 4.2.1 = Arduino ESP8266 core 3.1.2
platform = espressif8266 @ 4.2.1
framework = arduino
board = d1_mini
upload_speed = 921600
monitor_speed = 115200
