; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_dev]
platform = espressif32
framework = arduino

; 1. Base Board Pointer
board = esp32-s3-devkitc-1

; 2. Upload and Port Configurations
; Explicitly binding the confirmed Linux target link
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
upload_speed = 921600
monitor_speed = 115200

; 3. Flash & PSRAM Configuration (Matches QIO 80MHz Flash & OPI PSRAM)
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; 4. Build Flags (Configures Core routing, disables USB CDC on boot)
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; 5. Partition Scheme (3MB APP / 9.9MB FATFS)
board_build.partitions = app3M_fat9M_16MB.csv

; 6. External Libraries Management
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit SSD1306 @ ^2.5.9
    bblanchon/ArduinoJson @ ^7.0.4
