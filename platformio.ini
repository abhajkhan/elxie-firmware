; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Elxie HOME firmware = the team's game firmware + the Elxie Blocks engine (src/blocks).

[env:esp32s3_dev]
; Pinned: espressif32 7.x moved to Arduino core 3.x, where the game code's ESP-NOW
; callback no longer compiles. 6.13.0 = Arduino core 2.0.17 (what this code is built for).
platform = espressif32 @ 6.13.0
framework = arduino

; 1. Base Board Pointer
board = esp32-s3-devkitc-1

; 2. Upload and Port Configurations
; Explicitly binding the confirmed Linux target link
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
; No fixed COM port: BUILD/FLASH_HOME_FIRMWARE.bat pick Elxie's port automatically
; (or pass --upload-port COMx). The team's original setting was COM10.
upload_speed = 921600
monitor_speed = 115200

; 3. Flash & PSRAM Configuration (16 MB flash, DIO, PSRAM not used)
board_upload.flash_size = 16MB
; Some Elxie robots hang at power-on (blank OLED, RTCWDT reset every 9 s) when the
; firmware sets up the built-in octal PSRAM; the ESP-IDF testbench, which never uses
; PSRAM, runs fine on them. Nothing in this firmware needs PSRAM, so it is not used:
; DIO flash + "qspi" memory type (the octal PSRAM is then simply not found and skipped).
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_qspi

; 4. Build Flags (Configures Core routing, disables USB CDC on boot)
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    ; Elxie Blocks engine (src/blocks) needs C++17
    -std=gnu++17

build_unflags =
    -std=gnu++11

; 5. Partition Scheme (3MB APP / 9.9MB FATFS)
board_build.partitions = app3M_fat9M_16MB.csv

; 6. External Libraries Management
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit SSD1306 @ ^2.5.9
    bblanchon/ArduinoJson @ ^7.0.4
    ; Elxie Blocks: draws the face into RAM, sent to the OLED with Adafruit_SSD1306
    olikraus/U8g2 @ ^2.35.30
